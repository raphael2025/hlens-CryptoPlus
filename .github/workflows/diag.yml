name: diag-endpoints
on: { workflow_dispatch: {} }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          probe(){ printf "%-70s " "$1"; curl -s -m 15 -o /dev/null -w "%{http_code}\n" -A "hlens-diag/1.0" "$1" || echo ERR; }
          curl -s https://ifconfig.me; echo
          probe "https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT"
          probe "https://www.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT"
          probe "https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=BTCUSDT&period=1h&limit=1"
          probe "https://data-api.binance.vision/api/v3/ticker/price?symbol=BTCUSDT"
          probe "https://api.binance.us/api/v3/ticker/price?symbol=BTCUSDT"
          probe "https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT"
          probe "https://api.bytick.com/v5/market/tickers?category=linear&symbol=BTCUSDT"
          probe "https://api.bybit.com/v5/market/account-ratio?category=linear&symbol=BTCUSDT&period=1h&limit=1"
          probe "https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP"
          probe "https://api.gateio.ws/api/v4/futures/usdt/contracts/BTC_USDT"
          probe "https://api.bitget.com/api/v2/mix/market/ticker?symbol=BTCUSDT&productType=USDT-FUTURES"
          probe "https://fx-api.gateio.ws/api/v4/futures/usdt/liq_orders?contract=BTC_USDT&limit=5"
          probe "https://www.deribit.com/api/v2/public/get_book_summary_by_currency?currency=BTC&kind=future"
          probe "https://www.binance.com/fapi/v1/openInterest?symbol=BTCUSDT"
          probe "https://www.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT"
          probe "https://www.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=2"
          probe "https://www.binance.com/futures/data/globalLongShortAccountRatio?symbol=BTCUSDT&period=1h&limit=1"
          probe "https://www.binance.com/futures/data/topLongShortPositionRatio?symbol=BTCUSDT&period=1h&limit=1"
          probe "https://www.binance.com/futures/data/takerlongshortRatio?symbol=BTCUSDT&period=1h&limit=1"
          probe "https://www.binance.com/futures/data/openInterestHist?symbol=BTCUSDT&period=1h&limit=2"
          probe "https://www.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1h&limit=2"
          probe "https://api2.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT"
          probe "https://api.bybit.nl/v5/market/tickers?category=linear&symbol=BTCUSDT"
          probe "https://api.bybit-tr.com/v5/market/tickers?category=linear&symbol=BTCUSDT"
          probe "https://api.bybit.kz/v5/market/tickers?category=linear&symbol=BTCUSDT"
          probe "https://api.bybitglobal.com/v5/market/tickers?category=linear&symbol=BTCUSDT"
          echo "--- www.binance.com body sample"; curl -s -m 15 "https://www.binance.com/futures/data/globalLongShortAccountRatio?symbol=BTCUSDT&period=1h&limit=1" | head -c 300; echo
