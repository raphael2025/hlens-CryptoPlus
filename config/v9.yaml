# V9 frozen parameters. Changing any value = new version (AGENTS.md §2.2).
version: "9.2-swing.1"   # earlier sections unchanged

data:
  symbol: BTCUSDT
  warmup_start: "2020-01-01"   # history used only to warm up indicators
  dev_start: "2020-09-01"
  holdout_start: "2024-01-01"  # dev set ends here (exclusive); holdout only in R8

regime:                        # 4H, research plan §2
  slow_bars: 180               # 30 days
  fast_bars: 30                # 5 days
  er_bars: 30
  chop_quantile: 0.33
  chop_lookback_bars: 2190     # 365 days
  chop_min_bars: 1080          # 180 days; archive starts 2020-01, so the first months use < 1 year
  transition_bars: 30

structure:                     # 1H
  atr_bars: 14
  dc_atr_mult: 2.0

execution:                     # 15m
  atr_bars: 14
  dc_atr_mult: 2.0
  stop_buffer_atr1h: 0.25
  max_stop_atr1h: 3.0

risk:
  risk_per_trade: 0.005
  max_notional_x_equity: 3.0
  max_entries_per_thesis: 3    # first entry + 2 re-entries (D1)

exit:
  reclaim_bars_1h: 3           # D2 core
  trail_buffer_atr1h: 0.25     # not specified by the plan; set equal to the entry stop buffer

costs:
  taker_fee: 0.0005            # per side
  slippage: 0.0002             # per side

hypotheses:
  h9_max_stage: 3
  h10_q_min: 1.5
  h10_depth_max: 0.618

baselines:                     # B0 / B1 (research plan §3); fixed before any result was computed
  ma_windows: [20, 50, 100]    # days, all reported
  vol_window: 20               # days
  vol_target: 0.5              # annualised
  max_leverage: 2.0

trader:                        # research plan §7, fixed before any result
  ema_4h: [9, 21, 55, 200]
  vegas_filter: 12
  vegas_a: [144, 169]
  atr_bars: 14
  chop_ema_gap_atr4h: 0.5
  pullback_4h_bars: 3
  pullback_1h_bars: 4
  tunnel_touch_atr1h: 0.5
  sweep_reclaim_bars: 4        # 15m bars
  choch_window_bars: 16        # 15m bars after the sweep
  stop_buffer_atr1h: 0.25

entry_study:
  horizons_h: [4, 24, 72]
  passage_r: [2, 3]
  passage_window_h: 72
  random_samples: 20000
  seed: 0

swing:                         # research plan §9, fixed before any result
  fast_drop_bars: 8            # 15m bars
  fast_drop_atr1h: 3.0
  level_touch_atr1h: 0.25
  wick_frac: 0.5
  cooldown_bars: 8
  stop_buffer_atr1h: 0.25      # S1
  key_break_atr1h: 0.5         # S2
  key_reclaim_bars_1h: 2       # S2
  catastrophe_atr1h: 3.0       # S2 intrabar hard stop below the key level
  swing_min_mfe_r: 1.0         # E2
  strong_spread_bars_4h: 6     # E3
  fixed_target_r: 3.0          # E4
  trail_buffer_atr1h: 0.25     # E1
  max_hold_days: 14
  random_seeds: 20
