# hlens rate-limit constants. Source of truth: docs/06-DATA-SOURCES.md §3 and §4.
# Loaded by packages/hlens-core/src/hlens_core/ratelimit.
#
# Accounting key is the PUBLIC EGRESS IP, per venue. All processes behind one
# egress share one ledger (06 §4 rule 1).
#
#   limit   = the official upstream ceiling per egress IP
#   budget  = what we allow ourselves (40% of a CEX limit, 90% for HL; 06 §4 rule 2)
#   unit    = weight | request
#   source  = official   quoted verbatim from vendor docs (checked 2026-09-12)
#             measured   observed by us (this repo, hub, or Actions probes)
#             unverified docs do not state it; a conservative value is used
version: 1

defaults:
  max_inflight: 8
  aimd_cut: 0.75          # 06 §3.6: on 429 cut to 75% ...
  aimd_freeze_s: 3600     # ... and freeze the reduced level for 1 h
  aimd_recover_per_window: 0.05

venues:

  binance:
    unit: weight
    window_s: 60
    limit: 2400
    budget: 960            # 40%
    max_inflight: 8
    source: official
    rest_bases: ["https://fapi.binance.com", "https://www.binance.com"]
    # mirror www.binance.com serves the same paths; measured 200 from US egress
    # while fapi.binance.com returns 451 there (06 §5).
    rest_bases_source: measured
    ws_base: "wss://fstream.binance.com"
    used_weight_header: "X-MBX-USED-WEIGHT-1M"     # measured readable
    rate_limited_status: [429]
    banned_status: [418]                            # 418 = IP ban, Retry-After 2 min .. 3 d
    buckets:
      funding_history:
        unit: request
        limit: 500
        window_s: 300
        budget: 200
        source: official
    endpoint_buckets:
      "/fapi/v1/fundingRate": funding_history
      "/fapi/v1/fundingInfo": funding_history
    # Default weight per endpoint for the form WE call (all-market where noted).
    # Per-call overrides (single symbol = 1, tiered klines) are passed by the adapter.
    weights:
      "/fapi/v1/ping": 1
      "/fapi/v1/time": 1
      "/fapi/v1/exchangeInfo": 1
      "/fapi/v1/premiumIndex": 10          # all market; 1 with symbol=
      "/fapi/v1/fundingInfo": 1
      "/fapi/v1/fundingRate": 1
      "/fapi/v1/openInterest": 1           # per symbol only
      "/fapi/v1/ticker/24hr": 40           # all market; 1 with symbol=
      "/fapi/v1/klines": 5                 # tiered: <100:1 <500:2 <=1000:5 >1000:10
      "/fapi/v1/markPriceKlines": 5
      "/futures/data/openInterestHist": 0
      "/futures/data/globalLongShortAccountRatio": 0
      "/futures/data/topLongShortAccountRatio": 0
      "/futures/data/topLongShortPositionRatio": 0
      "/futures/data/takerlongshortRatio": 0
      "/futures/data/basis": 0
    weights_source: official
    probe_url: "https://fapi.binance.com/fapi/v1/ping"     # weight 1, cheapest
    time_url: "https://fapi.binance.com/fapi/v1/time"
    time_field: serverTime
    time_unit: ms

  bybit:
    unit: request
    window_s: 5
    limit: 600             # 600 requests / rolling 5 s, IP level
    budget: 10             # 120/min == 10 per 5 s window; deliberately far under
    max_inflight: 4
    source: official
    rest_bases: ["https://api.bybit.com"]
    ws_base: "wss://stream.bybit.com/v5/public/linear"
    rate_limited_status: [403]   # "access too frequent", ban >= 10 min
    geo_blocked_status: [403]    # NOTE: same code as rate limit; disambiguate by body
    probe_url: "https://api.bybit.com/v5/market/time"
    time_url: "https://api.bybit.com/v5/market/time"
    time_field: "result.timeNano"
    time_unit: ns
    notes: "US egress gets 403 on api.bybit.com and every mirror (06 §5, measured)."

  okx:
    unit: request
    window_s: 2
    limit: 20              # most public endpoints; per-endpoint table below
    budget: 8              # 40%
    max_inflight: 4
    source: official
    rest_bases: ["https://www.okx.com/api/v5"]
    ws_base: "wss://ws.okx.com:8443/ws/v5/public"
    ws_business_base: "wss://ws.okx.com:8443/ws/v5/business"
    rate_limited_code: 50011
    probe_url: "https://www.okx.com/api/v5/public/time"
    time_url: "https://www.okx.com/api/v5/public/time"
    time_field: "data.0.ts"
    time_unit: ms
    # OKX limits are declared per endpoint (06 §3.3). budget = 40% of limit,
    # rounded down, floor 2.
    buckets:
      "/market/tickers":        {unit: request, limit: 20, window_s: 2, budget: 8, source: official}
      "/public/open-interest":  {unit: request, limit: 20, window_s: 2, budget: 8, source: official}
      "/public/funding-rate":   {unit: request, limit: 10, window_s: 2, budget: 4, source: official}
      "/public/funding-rate-history": {unit: request, limit: 10, window_s: 2, budget: 4, source: official}
      "/public/instruments":    {unit: request, limit: 20, window_s: 2, budget: 8, source: official}
      "/market/candles":        {unit: request, limit: 40, window_s: 2, budget: 16, source: official}
      "/market/history-candles": {unit: request, limit: 20, window_s: 2, budget: 8, source: official}
      "/market/mark-price-candles": {unit: request, limit: 20, window_s: 2, budget: 8, source: official}
      "/rubik/stat/contracts/long-short-account-ratio-contract": {unit: request, limit: 5, window_s: 2, budget: 2, source: official}
      "/rubik/stat/contracts/long-short-position-ratio-contract-top-trader": {unit: request, limit: 5, window_s: 2, budget: 2, source: official}
      "/rubik/stat/contracts/long-short-account-ratio-contract-top-trader": {unit: request, limit: 5, window_s: 2, budget: 2, source: official}
      "/rubik/stat/taker-volume-contract": {unit: request, limit: 5, window_s: 2, budget: 2, source: official}
      "/public/position-tiers": {unit: request, limit: 10, window_s: 2, budget: 4, source: unverified}

  gate:
    unit: request
    window_s: 10
    limit: 200             # measured response header x-gate-ratelimit-limit: 200
    budget: 40             # 40 / 10 s
    max_inflight: 4
    source: measured
    limit_conflict: "rest-v4 README says 300 req/s/IP (official); headers say 200 per ~10 s. Headers win."
    rest_bases: ["https://api.gateio.ws/api/v4/futures/usdt"]
    ws_base: "wss://fx-ws.gateio.ws/v4/ws/usdt"
    remaining_header: "x-gate-ratelimit-requests-remain"
    limit_header: "x-gate-ratelimit-limit"
    reset_header: "x-gate-ratelimit-reset-timestamp"
    rate_limited_status: [429]
    probe_url: "https://api.gateio.ws/api/v4/futures/usdt/contracts/BTC_USDT"
    # Gate publishes no server-time endpoint; preflight falls back to the HTTP Date header.

  bitget:
    unit: request
    window_s: 1
    limit: 20              # 20/s/IP, low confidence (06 §3.5)
    budget: 8              # 40%
    max_inflight: 4
    source: unverified
    rest_bases: ["https://api.bitget.com/api/v2/mix/market"]
    ws_base: "wss://ws.bitget.com/v2/ws/public"
    ws_base_source: unverified   # repo hlens had /v3/ws/public; not in current docs
    rate_limited_status: [429]
    probe_url: "https://api.bitget.com/api/v2/public/time"
    time_url: "https://api.bitget.com/api/v2/public/time"
    time_field: "data.serverTime"
    time_unit: ms
    notes: "S0 must calibrate by measurement; several endpoints document no limit at all."

  hyperliquid:
    unit: weight
    window_s: 60
    limit: 1200
    budget: 1080           # 90%, hub discipline; ledger still counts against 1200
    max_inflight: 10       # hard cap: above this the connection limiter bites first
    source: official
    rest_bases: ["https://api.hyperliquid.xyz"]
    ws_base: "wss://api.hyperliquid.xyz/ws"
    leaderboard_url: "https://stats-data.hyperliquid.xyz/Mainnet/leaderboard"
    measured_capacity: 2350   # 2350-2990 W/min measured on one egress; we still budget 1200
    measured_capacity_source: measured
    rate_limited_status: [429]
    # Two distinct 429s, told apart by BODY, not status (06 §3.6, measured):
    #   body JSON `null`  -> application weight limiter  -> back off on weight
    #   body nginx HTML   -> connection/rate limiter     -> reduce max_inflight
    probe_method: POST
    probe_url: "https://api.hyperliquid.xyz/info"
    probe_body: {type: meta}
    # HL exposes no server time and no rate-limit headers; Date header only.
    # /info weights. 20 is the documented default for "other info requests";
    # unknown types are charged 20 (over-estimate is the safe direction).
    weights:
      clearinghouseState: 2
      spotClearinghouseState: 2
      l2Book: 2
      allMids: 2
      orderStatus: 2
      exchangeStatus: 2
      userRole: 60
      liquidatable: 20        # measured ~15-18, charged 20
      meta: 20
      metaAndAssetCtxs: 20
      predictedFundings: 20
      portfolio: 20
      userRateLimit: 20
      perpsAtOpenInterestCap: 20
      # variable-weight (charged per rows returned): value is the per-page UPPER
      # BOUND used by reserve(); settle() books the real cost afterwards.
      userFillsByTime: 120
      userFills: 120
      userFunding: 45
      userNonFundingLedgerUpdates: 120
      fundingHistory: 45
      candleSnapshot: 84
    weights_source: official
    # rows-per-weight for the variable endpoints
    rows_per_weight:
      userFillsByTime: 20
      userFills: 20
      userFunding: 20
      userNonFundingLedgerUpdates: 20
      fundingHistory: 20
      candleSnapshot: 60
    ws_limits:
      connections: 10
      new_connections_per_min: 30
      subscriptions: 1000
      distinct_users: 10
      messages_per_min: 2000
      inflight_posts: 100
    ws_budget:
      connections: 8
      subscriptions: 800
      distinct_users: 8
