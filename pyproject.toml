# hlens CryptoPlus — workspace root.
#
# Layout follows the last line of docs/03-ARCHITECTURE.md §4:
#   packages/hlens-core/      contracts (this task) · ratelimit · preflight · adapters · wallet
#   packages/hlens-collector/ universe · collector · health · notify · backfill · compute
#                             · liquidation · export + migrations/NNN_*.sql
#   config/ deploy/ site/ docs/
#
# Every version below is the lock table of docs/03-ARCHITECTURE.md §3. Do not
# bump one here without bumping it there.

[project]
name = "hlens-cryptoplus"
version = "0.0.0"
description = "hlens CryptoPlus — multi-venue crypto perpetual state reporting (workspace root)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["hlens-core"]

[tool.uv]
# The root is a virtual workspace root, not a distribution of its own.
package = false
# The whole §3 lock table, pinned in one place. A package declares only what it
# actually imports; these constraints fix the version it resolves to, so a later
# milestone cannot quietly land a different one.
constraint-dependencies = [
  "hatchling==1.32.3",
  "ruff==0.16.8",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",
  "httpx==0.28.1",
  "websockets==17.1",
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
  "types-pyyaml==6.0.12.20260906",
  "psycopg==3.3.6",
  "psycopg-pool==3.3.2",
]

[tool.uv.workspace]
members = ["packages/hlens-core"]

[tool.uv.sources]
hlens-core = { workspace = true }

[dependency-groups]
dev = [
  "ruff==0.16.8",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",
  # Stub-only distribution for PyYAML, which ships no type information. Needed
  # because §3 runs mypy in strict mode and the ledger parses the two YAML
  # config files. Not in §3's lock table — see the PR's "Doc corrections".
  "types-pyyaml==6.0.12.20260906",
]

# --------------------------------------------------------------------------- #
# pytest — docs/03-ARCHITECTURE.md §3 "测试规范"
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
# Hard-coded, deliberately: §3 says never rely on a human remembering the flag.
addopts = '-m "not live" --strict-markers'
markers = [
  "live: touches a real venue endpoint; excluded by addopts and only ever run on purpose",
]
# pytest-asyncio 1.4 default. Overriding the `event_loop` fixture is forbidden
# by §3 — use @pytest.mark.asyncio_event_loop for a wider loop scope.
asyncio_mode = "strict"
testpaths = ["tests"]

# --------------------------------------------------------------------------- #
# ruff — line length 100 per the §3 lock table
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/hlens-core/src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "TID", "UP", "W"]
# RUF001-003 flag "ambiguous" Unicode. The authoritative documents are written
# in Chinese and the conversion rules use "x"; quoting them verbatim in a
# docstring is how a reader checks the code against the document, so the
# full-width punctuation and the multiplication sign are deliberate. Identifiers
# and string values stay ASCII, which is what the rule is actually there for.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports]
# A parent-relative import is the easy way to hop out of your own module
# subpackage, so only same-level relative imports are allowed. Intra-module
# imports are `from .sibling import x`; cross-module absolute imports are banned
# below.
ban-relative-imports = "parents"

# Seam ③ (docs/03-ARCHITECTURE.md §2): modules talk through database tables and
# the hlens-core contracts, never by importing each other. Every module
# subpackage of §4 is banned here EXCEPT `contracts`, which is the shared
# contract layer every module is allowed to import.
#
# This is the fast fence. The authority is tests/test_module_boundaries.py,
# which asserts the whole dependency graph by AST — §2 names that test as the
# reviewer's check. A module that grows subpackages of its own will need a
# per-file-ignore for TID251 here; add it together with the edge in that test.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"hlens_core.ratelimit".msg = "seam ③: import it through a table or a contract, not directly"
"hlens_core.preflight".msg = "seam ③: import it through a table or a contract, not directly"
"hlens_core.adapters".msg = "seam ③: import it through a table or a contract, not directly"
"hlens_core.wallet".msg = "seam ⑤: wallet data has its own protocol and never enters market-data code"
"hlens_collector.universe".msg = "seam ③: import it through a table or a contract, not directly"
"hlens_collector.collector".msg = "seam ③: import it through a table or a contract, not directly"
"hlens_collector.health".msg = "seam ③: import it through a table or a contract, not directly"
"hlens_collector.notify".msg = "seam ③: import it through a table or a contract, not directly"
"hlens_collector.backfill".msg = "seam ③: import it through a table or a contract, not directly"
"hlens_collector.compute".msg = "seam ③: import it through a table or a contract, not directly"
"hlens_collector.liquidation".msg = "seam ③: import it through a table or a contract, not directly"
"hlens_collector.export".msg = "seam ③: import it through a table or a contract, not directly"

[tool.ruff.lint.per-file-ignores]
# TID251 bans a module's dotted path so that another module cannot import it.
# It cannot tell "someone else is importing ratelimit" from "ratelimit is
# importing its own submodule": ruff resolves `from .config import ...` to
# `hlens_core.ratelimit.config`, which matches the ban. An intra-module import
# is not an edge at all — tests/test_module_boundaries.py, the authority for
# seam ③, drops `owner == target` before it checks anything — so the ban is
# lifted inside each module's own directory, and only there. Add a line here
# when a module grows, together with its row in ALLOWED_EDGES.
"packages/hlens-core/src/hlens_core/ratelimit/*" = ["TID251"]
# Same for the two module subpackages M1-A4 adds. `adapters/base.py` imports
# `.capabilities` and `.symbols`; ruff resolves those to `hlens_core.adapters.*`
# and matches the ban. Adding these two lines is NOT a change to the dependency
# graph: ALLOWED_EDGES in tests/test_module_boundaries.py is untouched, and it
# ignores `owner == target` before it checks anything.
"packages/hlens-core/src/hlens_core/adapters/*" = ["TID251"]
# M1-A5 adds `adapters/binance/`, a subpackage one level deeper. ruff's glob
# does not cross a `/`, so `adapters/*` above does not reach it and it needs
# its own line. Same reasoning, same non-change: the binance modules import
# `hlens_core.adapters.{symbols,capabilities,admission,base}`, which is
# `owner == target` and not an edge at all — ALLOWED_EDGES is untouched.
"packages/hlens-core/src/hlens_core/adapters/binance/*" = ["TID251"]
# M1-A6 adds `adapters/hyperliquid/`, the sibling of `adapters/binance/` above,
# and needs its own line for the same reason: ruff's glob does not cross a `/`.
# Same non-change, too — these modules import
# `hlens_core.adapters.{symbols,capabilities,admission,base}`, which is
# `owner == target` and not an edge at all. ALLOWED_EDGES in
# tests/test_module_boundaries.py is untouched by this task.
"packages/hlens-core/src/hlens_core/adapters/hyperliquid/*" = ["TID251"]
"packages/hlens-core/src/hlens_core/wallet/*" = ["TID251"]
# M1-A3 adds `preflight/`. Same non-change as the lines above: its modules
# import `hlens_core.preflight.{verdict,budget,...}`, which ruff resolves to
# the banned dotted path even though `owner == target` and the boundary test
# drops such edges before it checks anything. ALLOWED_EDGES is untouched by
# this task.
"packages/hlens-core/src/hlens_core/preflight/*" = ["TID251"]
# The composition root (see its docstring). It is the ONE file allowed to name
# `ratelimit`, `adapters` and `preflight` in the same import block, and it can
# be that file precisely because it is not a module: it lives outside
# `packages/`, so the boundary test — which walks `packages/` — does not see an
# edge, because there is no module here to be the source of one. Seam ③ says
# modules do not import each other; a composition root is not a module, and
# wiring two of them together is what one is for.
"scripts/*" = ["TID251"]
# A module's offline tests have to import the module they test. Tests are not
# modules: they are not scanned by the boundary test (it walks `packages/`
# only) and they write no table, so seam ③ has nothing to say about them.
"tests/*" = ["TID251"]

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
# Production code only, for now. The contracts accept pydantic's lax input forms
# on purpose — a venue's raw decimal string is the exact value, and
# `model_validate_json` has to keep working — so a test that feeds `mark="123.4"`
# is statically a `str` where the annotation reads `Decimal`. Type-checking the
# tests would mean either widening the read type (wrong: a validated record's
# `mark` really is a Decimal) or making every adapter pre-convert. That is a
# call for the adapter step, not for the scaffold; see the PR.
files = ["packages", "scripts", "tests/test_adapter_admission.py", "tests/test_preflight_seam.py"]
# That one test file is type-checked with the production code on purpose: it is
# where seam ③'s dependency inversion is *proved*. It assigns a real
# `RateLimitLedger` to the `SpendAuthority` protocol the adapters declare, and
# that assignment is only evidence if a type checker looks at it — an
# `isinstance` check against a runtime-checkable protocol compares method names
# and would pass even with the wrong signatures. It is also where the
# liquidation `full` demo lives: strict mode's `warn_unused_ignores` turns the
# `# type: ignore[arg-type]` there into an error the moment `Completeness.FULL`
# becomes writable. The rest of `tests/` stays out; see M1-A2's PR note 10.
#
# M1-A3 adds two more paths for the same reason. `scripts/` holds the preflight
# composition root, where `LedgerConfig.load` is assigned to preflight's
# `BudgetLoader` and the two adapters' `CapabilitySet`s to `CapabilitySetView`:
# those three assignments ARE the proof that seam ③'s dependency inversion
# holds, and an unchecked assignment proves nothing.
# `tests/test_preflight_seam.py` makes the same assignments member by member,
# so that a drift says which property moved instead of only that something did.
