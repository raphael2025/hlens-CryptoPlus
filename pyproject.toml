[project]
name = "v9-research"
version = "0.1.0"
description = "Research framework for the V9 BTC perpetual-futures trend framework"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "polars>=1.20",
    "pyarrow>=18",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/v9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: touches the network; skipped by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
