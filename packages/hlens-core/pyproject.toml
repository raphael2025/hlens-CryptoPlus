# hlens-core — seam ① (normalized data contracts) and, from later M1 steps,
# the rate-limit ledger, the preflight CLI, the venue adapters and the wallet
# protocol. See docs/03-ARCHITECTURE.md §4.
#
# M1-A1 populates `contracts`; M1-A2 adds `ratelimit`. The remaining module
# subpackages are created by the step that owns them; there are deliberately no
# stub packages here.

[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "hlens-core"
version = "0.1.0"
description = "Normalized data contracts shared by every hlens CryptoPlus module (seam ①)"
license = "MIT"
requires-python = ">=3.12"
# pyyaml: the ledger reads config/venues.yaml and config/egress-consumers.yaml
# (03 §6.1), and the Binance adapter reads the base URLs out of the same file.
# httpx + websockets: M1-A5's venue adapter is the first thing here that opens
# a socket; both were already in the §3 lock table, so this only declares what
# the package actually imports. Versions constrained in the workspace root.
dependencies = [
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "websockets==17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hlens_core"]
