      security: [ { session: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PushSubscriptionInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PushSubscription" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/push-subscriptions/{id}:
    delete:
      operationId: deletePushSubscription
      tags: [me]
      summary: Remove a Web Push subscription
      security: [ { session: [] } ]
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
