      tags: [me]
      summary: Subscribe / unsubscribe the daily digest
      security: [ { session: [] }, { apiKey: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled, channel], properties: { enabled: { type: boolean }, channel: { $ref: "#/components/schemas/Channel" } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/push-subscriptions:
    get:
      operationId: listPushSubscriptions
      tags: [me]
      summary: Web Push subscriptions
