openapi: 3.1.0
info:
  title: hlens API
  version: 1.1.0
  description: |
    The perp positioning prism. Public GET endpoints need no auth.
    Conventions: snake_case; `ts` = unix ms; `*_usd` = USD; `*_share` = 0..1; `*_pct` = percent;
    funding rates as decimals (0.0001 = 0.01%). Missing data is null (typed as [T, "null"]), never 0.
    Every aggregate carries `as_of` and `sources`. Lists use the envelope {as_of, sources, items, next_cursor}.
servers:
  - url: https://api.hlens.xyz/v1
security: []
tags:
  - { name: market, description: "Prism, context, levels, history, insights" }
  - { name: funding, description: "Funding, open interest, long/short ratios" }
  - { name: liquidations, description: "Real liquidations and model heatmap" }
  - { name: whales, description: "Tracked wallets, positions, events, boards" }
  - { name: events, description: "Market events, scorecard, calendar, evidence" }
  - { name: macro, description: "Macro context; options and basis are v1.1" }
  - { name: system, description: "Status and share images" }
  - { name: me, description: "Authenticated user resources" }
x-hlens-ws:
  url: /v1/stream
  subscribe: "#/components/schemas/StreamSubscribe"
  message: "#/components/schemas/StreamMessage"
  channels:
    - { pattern: "prism:{symbol}", payload: "#/components/schemas/PrismPatch", cadence_s: 10 }
    - { pattern: "state:{symbol}", payload: "#/components/schemas/MarketState", cadence_s: 0 }
    - { pattern: "liq:*|liq:{symbol}", payload: "#/components/schemas/LiqBatch", cadence_s: 0.25 }
    - { pattern: "whale:events|whale:{address}", payload: "#/components/schemas/WhaleEvent", cadence_s: 0 }
    - { pattern: "events:*", payload: "#/components/schemas/Event", cadence_s: 0 }

paths:
  /coins:
    get:
      operationId: listCoins
      x-hlens-mcp: listCoins
      tags: [market]
      summary: Coins with prism summary (screener / batch lookup)
      x-hlens-cache: 60
      parameters:
        - { name: symbols, in: query, description: comma list; batch lookup for position bar, style: form, explode: false, schema: { type: array, items: { $ref: "#/components/schemas/Symbol" }, maxItems: 50 } }
        - { name: fields, in: query, description: extra columns, style: form, explode: false, schema: { type: array, items: { type: string, enum: [funding_spread, oi_chg24h_pct, taker_buy_share, oi_pctl_30d, liq_24h_long_usd, liq_24h_short_usd, vol24h_usd] } } }
        - { name: preset, in: query, schema: { $ref: "#/components/schemas/Preset" } }
        - { name: sort, in: query, schema: { type: string, enum: [crowding, -crowding, funding_apr_pct, -funding_apr_pct, oi_total_usd, -oi_total_usd, oi_chg24h_pct, -oi_chg24h_pct, gap_pts, -gap_pts, chg24h_pct, -chg24h_pct], default: -oi_total_usd } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }, X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" } }, content: { application/json: { schema: { $ref: "#/components/schemas/CoinList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /coins/{symbol}/prism:
    get:
      operationId: getPrism
      x-hlens-mcp: getPrism
      tags: [market]
      summary: Full prism for one coin
      x-hlens-cache: 10
      parameters: [ { $ref: "#/components/parameters/SymbolPath" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }, X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Prism" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /coins/{symbol}/explain:
    get:
      operationId: explainCoin
      x-hlens-mcp: explainCoin
      tags: [market]
      summary: Bilingual explanation of the prism with evidence tags and the inputs used
      x-hlens-cache: 60
      parameters: [ { $ref: "#/components/parameters/SymbolPath" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Explanation" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /coins/{symbol}/context:
    get:
      operationId: getContext
      x-hlens-mcp: getContext
      tags: [market]
      summary: Market context (state, key levels, last 24h, drivers, calendar)
      x-hlens-cache: 60
      parameters: [ { $ref: "#/components/parameters/SymbolPath" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }, X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Context" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /coins/{symbol}/levels:
    get:
      operationId: getLevels
      x-hlens-mcp: getLevels
      tags: [market]
      summary: Price ladder — real liquidations and whale liquidation prices first, model clusters second
      x-hlens-cache: 60
      parameters:
        - { $ref: "#/components/parameters/SymbolPath" }
        - { name: range_pct, in: query, schema: { type: number, minimum: 1, maximum: 50, default: 15 } }
        - { name: lev_weights, in: query, description: "e.g. 10:0.4,25:0.3,50:0.2,100:0.1", schema: { type: string, pattern: "^(\\d+:\\d*\\.?\\d+)(,\\d+:\\d*\\.?\\d+)*$" } }
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }, X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Levels" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /coins/{symbol}/history:
    get:
      operationId: getHistory
      x-hlens-mcp: getHistory
      tags: [market]
      summary: Time series of prism fields (aggregate, or one venue)
      x-hlens-cache: 60
      parameters:
        - { $ref: "#/components/parameters/SymbolPath" }
        - { name: fields, in: query, required: true, style: form, explode: false, schema: { type: array, minItems: 1, items: { $ref: "#/components/schemas/HistoryField" } } }
        - { name: venue, in: query, description: omit for aggregate, schema: { $ref: "#/components/schemas/Venue" } }
        - { name: interval, in: query, schema: { type: string, enum: [1m, 5m, 15m, 1h, 4h, 1d], default: 1h } }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }, X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Series" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /coins/{symbol}/state-history:
    get:
      operationId: getStateHistory
      x-hlens-mcp: getStateHistory
      tags: [market]
      summary: Hourly state labels for the state strip
      x-hlens-cache: 300
      parameters:
        - { $ref: "#/components/parameters/SymbolPath" }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/StateHistory" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /coins/{symbol}/snapshot:
    get:
      operationId: getSnapshot
      x-hlens-mcp: getSnapshot
      tags: [market]
      summary: Prism and sentence as they were at a past time (replay)
      x-hlens-cache: 3600
      parameters:
        - { $ref: "#/components/parameters/SymbolPath" }
        - { name: at, in: query, required: true, schema: { $ref: "#/components/schemas/Ts" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Snapshot" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /market/breadth:
    get:
      operationId: getBreadth
      x-hlens-mcp: getBreadth
      tags: [market]
      summary: Market breadth over top 100 coins
      x-hlens-cache: 300
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Breadth" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /insights:
    get:
      operationId: getInsights
      x-hlens-mcp: getInsights
      tags: [market]
      summary: Home page — abnormal three, market sentence, question cards
      x-hlens-cache: 60
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Insights" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /funding:
    get:
      operationId: listFunding
      x-hlens-mcp: listFunding
      tags: [funding]
      summary: Funding matrix, all coins x venues
      x-hlens-cache: 60
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [funding_apr_pct_abs, -funding_apr_pct_abs, funding_spread, -funding_spread, oi_total_usd, -oi_total_usd], default: -funding_apr_pct_abs } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }, X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" } }, content: { application/json: { schema: { $ref: "#/components/schemas/FundingList" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /funding/{symbol}/history:
    get:
      operationId: getFundingHistory
      x-hlens-mcp: getFundingHistory
      tags: [funding]
      summary: Funding history per venue and cumulative cost
      x-hlens-cache: 300
      parameters:
        - { $ref: "#/components/parameters/SymbolPath" }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FundingHistory" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /funding/arb:
    get:
      operationId: listFundingArb
      x-hlens-mcp: listFundingArb
      tags: [funding]
      summary: Cross-venue funding spreads with fee-adjusted APR (heuristic)
      x-hlens-cache: 60
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ArbList" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /oi/{symbol}/history:
    get:
      operationId: getOiHistory
      x-hlens-mcp: getOiHistory
      tags: [funding]
      summary: Open interest history per venue
      x-hlens-cache: 300
      parameters:
        - { $ref: "#/components/parameters/SymbolPath" }
        - { name: interval, in: query, schema: { type: string, enum: [5m, 1h, 1d], default: 1h } }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Series" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /ls/{symbol}:
    get:
      operationId: listLsRatios
      x-hlens-mcp: listLsRatios
      tags: [funding]
      summary: Current long/short ratios by venue and kind
      x-hlens-cache: 300
      parameters: [ { $ref: "#/components/parameters/SymbolPath" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LsRatioList" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /liquidations/recent:
    get:
      operationId: listLiquidations
      x-hlens-mcp: listLiquidations
      tags: [liquidations]
      summary: Recent real liquidations (a lower bound — exchanges throttle their feeds)
      x-hlens-cache: 10
      parameters:
        - { $ref: "#/components/parameters/SymbolQuery" }
        - { name: min_usd, in: query, schema: { type: number, minimum: 0, default: 0 } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }, X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" } }, content: { application/json: { schema: { $ref: "#/components/schemas/LiquidationList" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /liquidations/agg:
    get:
      operationId: getLiqAgg
      x-hlens-mcp: getLiqAgg
      tags: [liquidations]
      summary: Aggregated liquidations by symbol / venue / side
      x-hlens-cache: 60
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [1h, 4h, 24h], default: 24h } }
        - { name: group_by, in: query, schema: { type: string, enum: [symbol, venue, side], default: symbol } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LiqAggList" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /liquidations/heatmap/{symbol}:
    get:
      operationId: getLiqHeatmap
      x-hlens-mcp: getLiqHeatmap
      tags: [liquidations]
      summary: Model-estimated liquidation density grid (labelled model_estimated)
      x-hlens-cache: 300
      parameters:
        - { $ref: "#/components/parameters/SymbolPath" }
        - { name: days, in: query, schema: { type: integer, enum: [7, 30], default: 7 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Heatmap" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /liquidations/cascades:
    get:
      operationId: listCascades
      x-hlens-mcp: listCascades
      tags: [liquidations]
      summary: Detected liquidation cascades (relative threshold)
      x-hlens-cache: 60
      parameters: [ { $ref: "#/components/parameters/From" }, { $ref: "#/components/parameters/To" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CascadeList" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /whales:
    get:
      operationId: listWallets
      x-hlens-mcp: listWallets
      tags: [whales]
      summary: Tracked wallets
      x-hlens-cache: 60
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [account_value_usd, -account_value_usd, pnl_30d_usd, -pnl_30d_usd, roi_30d, -roi_30d, hit_rate_24h, -hit_rate_24h], default: -account_value_usd } }
        - { name: source, in: query, schema: { type: string, enum: [hyperliquid, okx, all], default: all } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }, X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" } }, content: { application/json: { schema: { $ref: "#/components/schemas/WalletList" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /whales/{address}:
    get:
      operationId: getWallet
      x-hlens-mcp: getWallet
      tags: [whales]
      summary: Wallet detail with positions, equity curve and recent events
      x-hlens-cache: 60
      parameters: [ { $ref: "#/components/parameters/AddressPath" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WalletDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /whales/{address}/fills:
    get:
      operationId: listWalletFills
      x-hlens-mcp: listWalletFills
      tags: [whales]
      summary: Wallet fills, newest first
      x-hlens-cache: 60
      parameters: [ { $ref: "#/components/parameters/AddressPath" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FillList" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /whales/positions:
    get:
      operationId: listWhalePositions
      x-hlens-mcp: listWhalePositions
      tags: [whales]
      summary: Largest open positions across tracked wallets
      x-hlens-cache: 30
      parameters:
        - { $ref: "#/components/parameters/SymbolQuery" }
        - { name: sort, in: query, schema: { type: string, enum: [notional_usd, -notional_usd, liq_distance_pct, -liq_distance_pct, upnl_usd, -upnl_usd], default: -notional_usd } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WhalePositionList" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /whales/events:
    get:
      operationId: listWhaleEvents
      x-hlens-mcp: listWhaleEvents
      tags: [whales]
      summary: Whale events (open / add / reduce / close / flip / near_liq / liquidated)
      x-hlens-cache: 10
      parameters:
        - { $ref: "#/components/parameters/SymbolQuery" }
        - { name: types, in: query, style: form, explode: false, schema: { type: array, items: { $ref: "#/components/schemas/WhaleEventType" } } }
        - { name: min_usd, in: query, schema: { type: number, minimum: 0, default: 0 } }
        - { name: address, in: query, schema: { $ref: "#/components/schemas/Address" } }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }, X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" } }, content: { application/json: { schema: { $ref: "#/components/schemas/WhaleEventList" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /whales/by-coin:
    get:
      operationId: listWhaleByCoin
      x-hlens-mcp: listWhaleByCoin
      tags: [whales]
      summary: Whale long/short notional per coin
      x-hlens-cache: 60
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WhaleCoinAggList" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /whales/boards:
    get:
      operationId: getWhaleBoards
      x-hlens-mcp: getWhaleBoards
      tags: [whales]
      summary: Bets / rekt-soon / closed-loss / winners-losers boards in one call
      x-hlens-cache: 30
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WhaleBoards" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /events:
    get:
      operationId: listEvents
      x-hlens-mcp: listEvents
      tags: [events]
      summary: Market event timeline ("what did I miss")
      x-hlens-cache: 60
      parameters:
        - { name: since, in: query, required: true, schema: { $ref: "#/components/schemas/Ts" } }
        - { name: until, in: query, schema: { $ref: "#/components/schemas/Ts" } }
        - { name: types, in: query, style: form, explode: false, schema: { type: array, items: { $ref: "#/components/schemas/EventType" } } }
        - { $ref: "#/components/parameters/SymbolQuery" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }, X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" } }, content: { application/json: { schema: { $ref: "#/components/schemas/EventList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /scorecard:
    get:
      operationId: getScorecard
      x-hlens-mcp: getScorecard
      tags: [events]
      summary: Forward-return distributions for pre-registered groups (states, whale events, OI quadrants)
      x-hlens-cache: 3600
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [30d, 90d, 365d], default: 90d } }
        - { name: group_prefix, in: query, schema: { type: string, enum: [state, whale, oiq, crowd] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Scorecard" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /calendar:
    get:
      operationId: listCalendar
      x-hlens-mcp: listCalendar
      tags: [events]
      summary: Upcoming funding settlements, expiries, macro dates, listings
      x-hlens-cache: 3600
      parameters: [ { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 7 } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarList" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /evidence:
    get:
      operationId: listEvidence
      x-hlens-mcp: listEvidence
      tags: [events]
      summary: Evidence library backing every `verified` tag
      x-hlens-cache: 3600
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceList" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /changelog:
    get:
      operationId: listChangelog
      tags: [events]
      summary: Rule, template and schema changes
      x-hlens-cache: 3600
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChangelogList" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /macro:
    get:
      operationId: getMacro
      x-hlens-mcp: getMacro
      tags: [macro]
      summary: Fear & Greed, stablecoin supply, ETF flows, dominance
      x-hlens-cache: 3600
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Macro" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /options/{currency}/summary:
    get:
      operationId: getOptionsSummary
      tags: [macro]
      summary: Deribit options summary (v1.1 — returns 501 until implemented)
      x-hlens-stage: v1.1
      x-hlens-cache: 300
      parameters: [ { $ref: "#/components/parameters/Currency" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OptionsSummary" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "501": { description: Not implemented in this stage, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /basis:
    get:
      operationId: listBasis
      tags: [macro]
      summary: Annualised basis term structure (v1.1 — returns 501 until implemented)
      x-hlens-stage: v1.1
      x-hlens-cache: 300
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BasisList" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "501": { description: Not implemented in this stage, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /status:
    get:
      operationId: getStatus
      x-hlens-mcp: getStatus
      tags: [system]
      summary: Source health, coverage and 30-day uptime
      x-hlens-cache: 30
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
  /og/{template}:
    get:
      operationId: getOgImage
      tags: [system]
      summary: Share card PNG (1200x630)
      x-hlens-cache: 300
      parameters:
        - { name: template, in: path, required: true, schema: { type: string, enum: [whale, coin, market] } }
        - { $ref: "#/components/parameters/SymbolQuery" }
        - { name: event_id, in: query, schema: { type: string } }
        - { name: locale, in: query, schema: { $ref: "#/components/schemas/Locale" } }
      responses:
        "200": { description: PNG image, headers: { Cache-Control: { schema: { type: string }, description: "public, max-age=300, immutable when event_id given" } }, content: { image/png: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current user
      security: [ { session: [] }, { apiKey: [] } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: updateMe
      tags: [me]
      summary: Update language, timezone, digest preference
      security: [ { session: [] }, { apiKey: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MeUpdate" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/positions:
    get:
      operationId: listMyPositions
      tags: [me]
      summary: Synced positions
      security: [ { session: [] }, { apiKey: [] } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyPositionList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createMyPosition
      tags: [me]
      summary: Create (idempotent on client_id)
      security: [ { session: [] }, { apiKey: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MyPositionInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/MyPosition" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/positions/{id}:
    patch:
      operationId: updateMyPosition
      tags: [me]
      summary: Update a position (last-writer-wins on updated_ts)
      security: [ { session: [] }, { apiKey: [] } ]
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MyPositionInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyPosition" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Newer version exists; body carries it, content: { application/json: { schema: { $ref: "#/components/schemas/MyPosition" } } } }
    delete:
      operationId: deleteMyPosition
      tags: [me]
      summary: Delete a position
      security: [ { session: [] }, { apiKey: [] } ]
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/watchlist:
    get:
      operationId: getWatchlist
      tags: [me]
      summary: Watched coins and wallets
      security: [ { session: [] }, { apiKey: [] } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Watchlist" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: addWatchItem
      tags: [me]
      summary: Add a coin or wallet
      security: [ { session: [] }, { apiKey: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WatchItem" } } } }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/Watchlist" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: removeWatchItem
      tags: [me]
      summary: Remove a coin or wallet
      security: [ { session: [] }, { apiKey: [] } ]
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [coin, wallet] } }
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/alerts:
    get:
      operationId: listAlerts
      tags: [me]
      summary: Alert rules
      security: [ { session: [] }, { apiKey: [] } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AlertRuleList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createAlert
      x-hlens-mcp: createAlert
      tags: [me]
      summary: Create an alert rule
      security: [ { session: [] }, { apiKey: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AlertRuleInput" } } } }
